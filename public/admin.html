<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - UniKart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-danger mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">UniKart · Admin</span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white" id="userName"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div id="msg"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="overview">Overview</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="users">Users</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="stores">Stores</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="orders">Orders</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="locations">Locations</button></li>
    </ul>

    <!-- Overview -->
    <section id="tab-overview"><div id="statsBox" class="row g-3"></div></section>

    <!-- Users -->
    <section id="tab-users" class="d-none">
      <div class="card card-body shadow-sm mb-4">
        <h6>Create a storekeeper or delivery account</h6>
        <div class="row g-2">
          <div class="col-md-3"><input id="uName" class="form-control" placeholder="Full name"></div>
          <div class="col-md-3"><input id="uEmail" type="email" class="form-control" placeholder="Email"></div>
          <div class="col-md-2"><input id="uPassword" type="password" class="form-control" placeholder="Password (6+)"></div>
          <div class="col-md-2">
            <select id="uRole" class="form-select">
              <option value="storekeeper">Storekeeper</option>
              <option value="delivery">Delivery</option>
            </select>
          </div>
          <div class="col-md-2"><button id="createUserBtn" class="btn btn-success w-100">Create</button></div>
        </div>
        <div class="row g-2 mt-1" id="storeFields">
          <div class="col-md-6"><input id="uStoreName" class="form-control" placeholder="Store name (for storekeepers)"></div>
          <div class="col-md-6"><input id="uStoreLocation" class="form-control" placeholder="Store location, e.g. Near Library"></div>
        </div>
      </div>

      <div class="table-responsive card shadow-sm">
        <table class="table align-middle mb-0">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Stores -->
    <section id="tab-stores" class="d-none">
      <div class="table-responsive card shadow-sm">
        <table class="table align-middle mb-0">
          <thead><tr><th>Store</th><th>Owner</th><th>Products</th><th>Orders</th><th>Status</th><th></th></tr></thead>
          <tbody id="storeRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Orders -->
    <section id="tab-orders" class="d-none">
      <div class="table-responsive card shadow-sm">
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>#</th><th>Customer</th><th>Store</th><th>Deliver to</th><th>Delivery person</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Locations -->
    <section id="tab-locations" class="d-none">
      <div class="card card-body shadow-sm mb-4">
        <h6>Add a delivery location</h6>
        <div class="row g-2">
          <div class="col-md-6"><input id="lName" class="form-control" placeholder="e.g. ECE Department - Room 102"></div>
          <div class="col-md-4">
            <select id="lType" class="form-select">
              <option value="department">Department</option>
              <option value="classroom">Classroom</option>
              <option value="hostel">Hostel</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-md-2"><button id="addLocationBtn" class="btn btn-success w-100">Add</button></div>
        </div>
      </div>
      <div class="table-responsive card shadow-sm">
        <table class="table align-middle mb-0">
          <thead><tr><th>Location</th><th>Type</th><th></th></tr></thead>
          <tbody id="locationRows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
