<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Dashboard - UniKart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">UniKart · <span id="storeName">Store</span></span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white" id="userName"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div id="msg"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="active">Active orders</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="history">Order history</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="products">Products & stock</button></li>
    </ul>

    <section id="tab-active"><div id="activeList"></div></section>
    <section id="tab-history" class="d-none"><div id="historyList"></div></section>

    <section id="tab-products" class="d-none">
      <div class="card card-body shadow-sm mb-4">
        <h6>Add a new product</h6>
        <div class="row g-2">
          <div class="col-md-4"><input id="newName" class="form-control" placeholder="Product name"></div>
          <div class="col-md-3"><input id="newCategory" class="form-control" placeholder="Category"></div>
          <div class="col-md-2"><input id="newPrice" type="number" min="1" class="form-control" placeholder="Price"></div>
          <div class="col-md-2"><input id="newStock" type="number" min="0" class="form-control" placeholder="Stock"></div>
          <div class="col-md-1"><button id="addProductBtn" class="btn btn-success w-100">Add</button></div>
        </div>
      </div>

      <div class="table-responsive card shadow-sm">
        <table class="table align-middle mb-0">
          <thead><tr><th>Product</th><th>Category</th><th style="width:130px">Price (₹)</th><th style="width:130px">Stock</th><th></th></tr></thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/store.js"></script>
</body>
</html>
