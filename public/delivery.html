<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery - UniKart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">UniKart · Delivery</span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white" id="userName"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5" style="max-width: 800px;">
    <div id="msg"></div>

    <h5>My current deliveries</h5>
    <div id="myActive" class="mb-4"></div>

    <h5>Available pickups</h5>
    <div id="availableList" class="mb-4"></div>

    <h5>Completed deliveries</h5>
    <div id="doneList"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/delivery.js"></script>
</body>
</html>
