<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - UniKart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">
      <a href="/" class="back-link">&larr; Back to home</a>

      <div class="text-center my-3">
        <div class="auth-logo">🎓</div>
        <h3 class="fw-bold mb-0" style="color:#0d1f4c;">Create your account</h3>
        <p class="text-muted small">Join UniKart and shop from your campus stores</p>
      </div>

      <div id="msg"></div>

      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" id="name" class="form-control" placeholder="Your name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password (min 6 characters)</label>
        <input type="password" id="password" class="form-control" placeholder="Choose a password">
      </div>
      <button id="registerBtn" class="btn btn-primary btn-lg w-100">Register</button>

      <p class="text-center mt-3 mb-1">Already have an account? <a href="/login.html">Login</a></p>
      <p class="text-center mb-0"><a href="/customer.html" class="back-link">Just looking? Browse stores &rarr;</a></p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    async function doRegister() {
      const msg = document.getElementById('msg');
      try {
        const data = await api('/api/auth/register', 'POST', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        msg.innerHTML = `<div class="alert alert-success">${esc(data.message)}</div>`;
        setTimeout(() => (window.location.href = '/login.html'), 1200);
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
      }
    }

    document.getElementById('registerBtn').addEventListener('click', doRegister);
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doRegister(); });

    // Already logged in? Go straight to your dashboard
    api('/api/auth/me')
      .then((data) => (window.location.href = HOME_PAGE[data.user.role]))
      .catch(() => {});
  </script>
</body>
</html>
