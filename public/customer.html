<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniKart - Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🛒 UniKart</a>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <a href="/" class="btn btn-outline-light btn-sm">Home</a>

        <!-- Shown to logged-in customers -->
        <div id="memberArea" class="d-none">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="text-white me-1" id="userName"></span>
            <a href="/orders.html" class="btn btn-light btn-sm">My Orders</a>
            <button class="btn btn-light btn-sm" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
              🛒 Cart <span id="cartCount" class="badge bg-danger ms-1">0</span>
            </button>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
          </div>
        </div>

        <!-- Shown to visitors who are not logged in -->
        <div id="guestArea" class="d-none">
          <div class="d-flex align-items-center gap-2">
            <a href="/login.html" class="btn btn-light btn-sm">Login</a>
            <a href="/register.html" class="btn btn-outline-light btn-sm">Register</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <!-- Choose a store -->
    <section id="storesView">
      <h4 class="mb-1">Choose a campus store</h4>
      <p class="text-muted">Pick a shop to see what it sells.</p>
      <div id="storeList" class="row g-3"></div>
    </section>

    <!-- Browse its products -->
    <section id="productsView" class="d-none">
      <button id="backBtn" class="btn btn-link px-0 mb-2">&larr; All stores</button>
      <h4 id="storeTitle"></h4>
      <p id="storeLocation" class="text-muted"></p>

      <div class="row g-2 mb-3">
        <div class="col-md-8">
          <input id="searchBox" class="form-control" placeholder="🔍 Search products...">
        </div>
        <div class="col-md-4">
          <select id="categoryBox" class="form-select">
            <option value="">All categories</option>
          </select>
        </div>
      </div>

      <div id="productList" class="row g-3"></div>
    </section>
  </div>

  <!-- Cart slides in from the right -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Your Cart</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cartItems" class="flex-grow-1"></div>
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between fw-bold mb-3">
          <span>Total</span><span id="cartTotal">₹0</span>
        </div>
        <button id="checkoutBtn" class="btn btn-success w-100">Proceed to checkout</button>
      </div>
    </div>
  </div>

  <!-- Checkout window -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Checkout</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="checkoutMsg"></div>
          <div id="checkoutSummary" class="mb-3"></div>
          <label class="form-label fw-semibold">Deliver to</label>
          <select id="locationBox" class="form-select mb-3"></select>
          <p class="small text-muted mb-0">Payment: cash on delivery</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="placeOrderBtn" class="btn btn-success">Place order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- "Please log in" popup for visitors -->
  <div class="modal fade" id="loginPromptModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3 text-center">
        <div class="modal-body">
          <div class="fs-1 mb-2">🔒</div>
          <h5>Please log in to add items to your cart</h5>
          <p class="text-muted">It only takes a moment, and you will come back to this store.</p>
          <div class="d-grid gap-2">
            <a href="/login.html" class="btn btn-primary">Login</a>
            <a href="/register.html" class="btn btn-outline-primary">Create account</a>
            <button type="button" class="btn btn-link text-muted" data-bs-dismiss="modal">Keep browsing</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/customer.js"></script>
</body>
</html>
